<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Editor — Playground</title>
  </head>
  <body>
    <main class="demo">
      <h1>Text Editor Playground</h1>
      <div id="menubar" class="editor-menubar"></div>
      <div id="toolbar" class="editor-toolbar"></div>
      <div class="review-layout">
        <div id="editor" class="editor-surface"></div>
        <aside id="comments" class="editor-comments-host"></aside>
      </div>
      <section class="output">
        <h2>HTML output</h2>
        <pre id="output"></pre>
      </section>
      <footer id="status" class="editor-status"></footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
